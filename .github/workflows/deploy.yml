name: 'GitHub Pages Deployment'

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy.yml'
      - 'package-lock.json'
      - 'CHANGELOG.md'

jobs:
  build:
    runs-on: ubuntu-latest
        
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.SUPPETY_PAT }}

      - name: 'Setup-Node'
        uses: actions/setup-node@v7
        with:
          cache: 'npm'

      - name: '> npm ci'
        run: |
          npm ci

      - name: '> npm run build'
        run: |
          npm run build

      - name: 'Upload Artifact'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 'Deploy'
        id: deployment
        uses: actions/deploy-pages@v5
